<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navy Cooperation Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="quadrant red">
            <div class="quadrant-label">Red</div>
            <div class="timer">03:00</div>
        </div>
        <div class="quadrant blue">
            <div class="quadrant-label">Blue</div>
            <div class="timer">03:00</div>
        </div>
        <div class="quadrant green">
            <div class="quadrant-label">Green</div>
            <div class="timer">03:00</div>
        </div>
        <div class="quadrant yellow">
            <div class="quadrant-label">Yellow</div>
            <div class="timer">03:00</div>
        </div>
    </div>
    
    <!-- Bonus animation container created dynamically by script.js -->
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
